# ---------------------------------------------------------------
# Configuración común a los dos nodos del clúster VidaSalud
# ---------------------------------------------------------------

# Formación del clúster: lista fija de nodos (classic config).
# Cada nodo lee esta lista al arrancar y se une al clúster solo,
# sin comandos manuales. Es el método declarativo recomendado
# cuando se conocen los nombres de los nodos de antemano.
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbit1
cluster_formation.classic_config.nodes.2 = rabbit@rabbit2

# Si un nodo pierde contacto con el otro, al reconectar se sincroniza
# con el que tenga el clúster activo.
cluster_partition_handling = autoheal

# El usuario administrador puede entrar a la consola web desde otra
# máquina (por defecto solo se permitiría desde el propio contenedor).
loopback_users = none
